<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" role="img" aria-label="Industry 4.0 throughput bottleneck analysis">
<style>
:root{--line:#30363d;--ink:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--grn:#3fb950;--amb:#d29922;--red:#f85149;--pnl:#161b22;--bg:#0d1117}
@media (prefers-color-scheme:light){:root{--line:#d0d7de;--ink:#24292f;--mut:#57606a;--acc:#0969da;--grn:#1a7f37;--amb:#9a6700;--red:#cf222e;--pnl:#f6f8fa;--bg:#ffffff}}
text{font-family:Inter,system-ui,-apple-system,sans-serif}
.t{fill:var(--ink)}.m{fill:var(--mut)}.a{fill:var(--acc)}.g{fill:var(--grn)}.w{fill:var(--amb)}
.bx{fill:var(--pnl);stroke:var(--line);stroke-width:1}
.bxa{fill:var(--pnl);stroke:var(--acc);stroke-width:1.4}
.fl{stroke:var(--acc);fill:none;stroke-width:1.4}
.fm{stroke:var(--mut);fill:none;stroke-width:1;stroke-dasharray:3 3}
</style>
<text x="12" y="20" class="t" font-size="11" font-weight="600">Throughput Bottleneck Analysis &#8212; cloud CPS, Industry 4.0</text>
<g font-size="6.5">
<rect class="bx" x="12" y="36" width="44" height="30" rx="4"/><text x="34" y="48" class="m" text-anchor="middle">M1</text><text x="34" y="59" class="m" text-anchor="middle">shop floor</text>
<rect class="bx" x="64" y="36" width="44" height="30" rx="4"/><text x="86" y="48" class="m" text-anchor="middle">M2</text>
<rect class="bxa" x="116" y="36" width="44" height="30" rx="4"/><text x="138" y="48" class="a" text-anchor="middle" font-weight="600">M3</text><text x="138" y="59" class="w" text-anchor="middle">shifting BN</text>
<rect class="bx" x="168" y="36" width="44" height="30" rx="4"/><text x="190" y="48" class="m" text-anchor="middle">M4</text>
</g>
<path class="fl" d="M56 51h8M108 51h8M160 51h8"/>
<path class="fm" d="M34 66v14h176V66"/>
<path class="fm" d="M122 80v12"/>
<g font-size="6.5">
<rect class="bx" x="252" y="36" width="136" height="30" rx="4"/>
<text x="320" y="48" class="m" text-anchor="middle" font-weight="600">Sensors &#8594; cloud CPS</text>
<text x="320" y="59" class="m" text-anchor="middle">active period &#183; blockage &#183; starvation</text>
</g>
<path class="fl" d="M212 51h40"/>
<g font-size="6.5">
<rect class="bxa" x="60" y="94" width="120" height="28" rx="4"/>
<text x="120" y="106" class="a" text-anchor="middle" font-weight="600">Detect &#183; predict &#183; shift</text>
<text x="120" y="116" class="m" text-anchor="middle">bottleneck moves over time</text>
<rect class="bx" x="200" y="94" width="120" height="28" rx="4"/>
<text x="260" y="106" class="m" text-anchor="middle" font-weight="600">Reallocate resources</text>
<text x="260" y="116" class="m" text-anchor="middle">simulation-based DSS</text>
</g>
<path class="fl" d="M180 108h20"/>
<line x1="12" y1="134" x2="388" y2="134" stroke="var(--line)"/>
<text x="12" y="149" class="m" font-size="7.5">The bottleneck is not a fixed machine &#8212; it migrates. Detecting the shift is the whole problem.</text>
<text x="12" y="163" class="a" font-size="7.5" font-weight="600">Computers &amp; Industrial Engineering 2022 (100 citations) &#183; Journal of Manufacturing Systems 2024 (81)</text>
<text x="12" y="175" class="m" font-size="7.5">Procedia Computer Science 2024 &#183; developed within ACCURATE 4.0</text>
</svg>
