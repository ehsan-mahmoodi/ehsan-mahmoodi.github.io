<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" role="img" aria-label="Multi-agent AI for sustainable manufacturing">
<style>
:root{--line:#30363d;--ink:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--grn:#3fb950;--amb:#d29922;--red:#f85149;--pnl:#161b22;--bg:#0d1117}
@media (prefers-color-scheme:light){:root{--line:#d0d7de;--ink:#24292f;--mut:#57606a;--acc:#0969da;--grn:#1a7f37;--amb:#9a6700;--red:#cf222e;--pnl:#f6f8fa;--bg:#ffffff}}
text{font-family:Inter,system-ui,-apple-system,sans-serif}
.t{fill:var(--ink)}.m{fill:var(--mut)}.a{fill:var(--acc)}.g{fill:var(--grn)}.w{fill:var(--amb)}
.bx{fill:var(--pnl);stroke:var(--line);stroke-width:1}
.bxa{fill:var(--pnl);stroke:var(--acc);stroke-width:1.4}
.fl{stroke:var(--acc);fill:none;stroke-width:1.4}
.fm{stroke:var(--mut);fill:none;stroke-width:1;stroke-dasharray:3 3}
</style>
<text x="12" y="20" class="t" font-size="11" font-weight="600">AI-COMPETE &#8212; coordinated agents for green scheduling</text>
<g font-size="6.5">
<circle cx="200" cy="70" r="26" class="bxa"/>
<text x="200" y="68" class="a" text-anchor="middle" font-weight="600">Coordinator</text>
<text x="200" y="78" class="m" text-anchor="middle">agent</text>
<circle cx="88" cy="42" r="21" class="bx"/><text x="88" y="40" class="m" text-anchor="middle">Scheduling</text><text x="88" y="49" class="m" text-anchor="middle">agent</text>
<circle cx="88" cy="104" r="21" class="bx"/><text x="88" y="102" class="m" text-anchor="middle">Energy</text><text x="88" y="111" class="m" text-anchor="middle">agent</text>
<circle cx="312" cy="42" r="21" class="bx"/><text x="312" y="40" class="m" text-anchor="middle">Digital</text><text x="312" y="49" class="m" text-anchor="middle">twin</text>
<circle cx="312" cy="104" r="21" class="bx"/><text x="312" y="102" class="m" text-anchor="middle">Carbon</text><text x="312" y="111" class="m" text-anchor="middle">agent</text>
</g>
<path class="fl" d="M109 48 Q150 54 176 62"/>
<path class="fl" d="M109 98 Q150 90 176 80"/>
<path class="fl" d="M224 62 Q262 54 291 48"/>
<path class="fl" d="M224 80 Q262 90 291 98"/>
<path class="fm" d="M88 63v20"/>
<path class="fm" d="M312 63v20"/>
<line x1="12" y1="134" x2="388" y2="134" stroke="var(--line)"/>
<text x="12" y="149" class="m" font-size="7.5">Productivity and carbon footprint pull in opposite directions; the agents negotiate rather than</text>
<text x="12" y="161" class="m" font-size="7.5">optimise one at the cost of the other.</text>
<text x="12" y="175" class="a" font-size="7.5" font-weight="600">Vinnova SEK 6.49 M &#183; Volvo Penta, Scania, Daloc &#183; Sk&#246;vde and Uppsala</text>
</svg>
