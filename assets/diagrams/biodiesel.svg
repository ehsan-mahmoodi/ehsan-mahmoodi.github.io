<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" role="img" aria-label="SME-scale biodiesel plant process flow">
<style>
:root{--line:#30363d;--ink:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--grn:#3fb950;--amb:#d29922;--red:#f85149;--pnl:#161b22;--bg:#0d1117}
@media (prefers-color-scheme:light){:root{--line:#d0d7de;--ink:#24292f;--mut:#57606a;--acc:#0969da;--grn:#1a7f37;--amb:#9a6700;--red:#cf222e;--pnl:#f6f8fa;--bg:#ffffff}}
text{font-family:Inter,system-ui,-apple-system,sans-serif}
.t{fill:var(--ink)}.m{fill:var(--mut)}.a{fill:var(--acc)}.g{fill:var(--grn)}.w{fill:var(--amb)}
.bx{fill:var(--pnl);stroke:var(--line);stroke-width:1}
.bxa{fill:var(--pnl);stroke:var(--acc);stroke-width:1.4}
.fl{stroke:var(--acc);fill:none;stroke-width:1.4}
.fm{stroke:var(--mut);fill:none;stroke-width:1;stroke-dasharray:3 3}
</style>
<text x="12" y="20" class="t" font-size="11" font-weight="600">SME Biodiesel &#8212; transesterification process train</text>
<g font-size="7">
<rect class="bx" x="10" y="38" width="48" height="30" rx="4"/><text x="34" y="50" class="m" text-anchor="middle">Feedstock</text><text x="34" y="61" class="g" text-anchor="middle">UCO &#183; rapeseed</text>
<rect class="bx" x="70" y="38" width="44" height="30" rx="4"/><text x="92" y="50" class="m" text-anchor="middle">Pre-treat</text><text x="92" y="61" class="m" text-anchor="middle">dry &#183; filter</text>
<rect class="bxa" x="126" y="38" width="56" height="30" rx="4"/><text x="154" y="50" class="a" text-anchor="middle" font-weight="600">REACTOR</text><text x="154" y="61" class="m" text-anchor="middle">KOH 60&#176;C</text>
<rect class="bx" x="194" y="38" width="48" height="30" rx="4"/><text x="218" y="50" class="m" text-anchor="middle">Separator</text><text x="218" y="61" class="m" text-anchor="middle">gravity</text>
<rect class="bx" x="254" y="38" width="44" height="30" rx="4"/><text x="276" y="50" class="m" text-anchor="middle">Wash</text><text x="276" y="61" class="m" text-anchor="middle">&amp; dry</text>
<rect class="bxa" x="310" y="38" width="76" height="30" rx="4"/><text x="348" y="50" class="a" text-anchor="middle" font-weight="600">BIODIESEL</text><text x="348" y="61" class="m" text-anchor="middle">EN 14214 FAME</text>
</g>
<path class="fl" d="M58 53h12M114 53h12M182 53h12M242 53h12M298 53h12"/>
<g font-size="7">
<rect class="bx" x="126" y="88" width="56" height="24" rx="4"/><text x="154" y="97" class="m" text-anchor="middle">Methanol</text><text x="154" y="107" class="m" text-anchor="middle">+ catalyst</text>
<rect class="bx" x="194" y="88" width="48" height="24" rx="4"/><text x="218" y="97" class="w" text-anchor="middle">Glycerol</text><text x="218" y="107" class="m" text-anchor="middle">by-product</text>
<rect class="bx" x="254" y="88" width="44" height="24" rx="4"/><text x="276" y="102" class="m" text-anchor="middle">MeOH rec.</text>
</g>
<path class="fl" d="M154 88V68"/>
<path class="fl" d="M218 68v20"/>
<path class="fm" d="M276 88V68"/>
<path class="fm" d="M276 100h-34"/>
<line x1="12" y1="126" x2="388" y2="126" stroke="var(--line)"/>
<g font-size="7.5">
<text x="12" y="142" class="m">Scale</text><text x="12" y="154" class="t" font-size="9.5" font-weight="600">3,000 t/yr</text>
<text x="96" y="142" class="m">Conversion</text><text x="96" y="154" class="g" font-size="9.5" font-weight="600">&gt; 96.5 %</text>
<text x="188" y="142" class="m">Glycerol</text><text x="188" y="154" class="t" font-size="9.5" font-weight="600">~10 % w/w</text>
<text x="280" y="142" class="m">Target region</text><text x="280" y="154" class="a" font-size="9.5" font-weight="600">N. Iran</text>
</g>
<text x="12" y="172" class="m" font-size="7.5">Design case study &#183; builds on 2009 BSc work on catalysed and supercritical routes</text>
</svg>
