<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" role="img" aria-label="Comparison of commercial simulation-optimization packages">
<style>
:root{--line:#30363d;--ink:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--grn:#3fb950;--amb:#d29922;--red:#f85149;--pnl:#161b22;--bg:#0d1117}
@media (prefers-color-scheme:light){:root{--line:#d0d7de;--ink:#24292f;--mut:#57606a;--acc:#0969da;--grn:#1a7f37;--amb:#9a6700;--red:#cf222e;--pnl:#f6f8fa;--bg:#ffffff}}
text{font-family:Inter,system-ui,-apple-system,sans-serif}
.t{fill:var(--ink)}.m{fill:var(--mut)}.a{fill:var(--acc)}.g{fill:var(--grn)}.w{fill:var(--amb)}
.bx{fill:var(--pnl);stroke:var(--line);stroke-width:1}
.bxa{fill:var(--pnl);stroke:var(--acc);stroke-width:1.4}
.fl{stroke:var(--acc);fill:none;stroke-width:1.4}
.fm{stroke:var(--mut);fill:none;stroke-width:1;stroke-dasharray:3 3}
</style>
<text x="12" y="20" class="t" font-size="11" font-weight="600">Sim-Opt Benchmark &#8212; OptQuest vs Witness Optimizer</text>
<g font-size="7">
<rect class="bxa" x="24" y="38" width="150" height="30" rx="4"/>
<text x="99" y="51" class="a" text-anchor="middle" font-weight="600">OptQuest</text>
<text x="99" y="62" class="m" text-anchor="middle">scatter search + tabu</text>
<rect class="bx" x="226" y="38" width="150" height="30" rx="4"/>
<text x="301" y="51" class="m" text-anchor="middle" font-weight="600">Witness Optimizer</text>
<text x="301" y="62" class="m" text-anchor="middle">simulated annealing</text>
</g>
<text x="200" y="57" class="m" font-size="8" text-anchor="middle">vs</text>
<g font-size="6.5">
<text x="24" y="88" class="m">solution quality</text>
<rect x="120" y="81" width="64" height="8" fill="var(--grn)" opacity="0.8"/>
<rect x="226" y="81" width="46" height="8" fill="var(--acc)" opacity="0.5"/>
<text x="24" y="104" class="m">convergence speed</text>
<rect x="120" y="97" width="50" height="8" fill="var(--grn)" opacity="0.8"/>
<rect x="226" y="97" width="58" height="8" fill="var(--acc)" opacity="0.5"/>
<text x="24" y="120" class="m">robustness to noise</text>
<rect x="120" y="113" width="60" height="8" fill="var(--grn)" opacity="0.8"/>
<rect x="226" y="113" width="38" height="8" fill="var(--acc)" opacity="0.5"/>
</g>
<line x1="12" y1="134" x2="388" y2="134" stroke="var(--line)"/>
<text x="12" y="148" class="m" font-size="7.5">A controlled benchmark on common test problems, putting two commercial packages on equal</text>
<text x="12" y="160" class="m" font-size="7.5">footing rather than trusting vendor claims.</text>
<text x="12" y="174" class="a" font-size="7.5" font-weight="600">Winter Simulation Conference 2011 &#183; 63 citations</text>
</svg>
