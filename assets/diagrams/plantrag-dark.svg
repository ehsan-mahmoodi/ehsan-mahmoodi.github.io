<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" role="img" aria-label="Agentic RAG pipeline with claim verification loop">
<style>
:root{--line:#30363d;--ink:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--grn:#3fb950;--amb:#d29922;--red:#f85149;--pnl:#161b22;--bg:#0d1117}
text{font-family:Inter,system-ui,-apple-system,sans-serif}
.t{fill:var(--ink)}.m{fill:var(--mut)}.a{fill:var(--acc)}.g{fill:var(--grn)}.w{fill:var(--amb)}.r{fill:var(--red)}
.bx{fill:var(--pnl);stroke:var(--line);stroke-width:1}
.bxa{fill:var(--pnl);stroke:var(--acc);stroke-width:1.4}
.fl{stroke:var(--acc);fill:none;stroke-width:1.4}
.fm{stroke:var(--mut);fill:none;stroke-width:1;stroke-dasharray:3 3}
</style>
<text x="12" y="20" class="t" font-size="11" font-weight="600">Agentic RAG &#8212; every sentence cited, every claim checked</text>
<g font-size="6.5">
<rect x="12" y="50" width="56" height="34" rx="5" class="bx"/><text x="40.0" y="65.0" class="t" text-anchor="middle" font-weight="600">Decompose</text><text x="40.0" y="75.0" class="m" text-anchor="middle">sub-questions</text>
<rect x="76" y="50" width="56" height="34" rx="5" class="bxa"/><text x="104.0" y="65.0" class="a" text-anchor="middle" font-weight="600">Hybrid</text><text x="104.0" y="75.0" class="m" text-anchor="middle">dense + BM25</text>
<rect x="140" y="50" width="56" height="34" rx="5" class="bx"/><text x="168.0" y="65.0" class="t" text-anchor="middle" font-weight="600">Re-rank</text><text x="168.0" y="75.0" class="m" text-anchor="middle">50 &#8594; 8</text>
<rect x="204" y="50" width="56" height="34" rx="5" class="bx"/><text x="232.0" y="65.0" class="t" text-anchor="middle" font-weight="600">Draft</text><text x="232.0" y="75.0" class="m" text-anchor="middle">cited [doc&#183;rev]</text>
<rect x="268" y="50" width="56" height="34" rx="5" class="bxa"/><text x="296.0" y="65.0" class="a" text-anchor="middle" font-weight="600">Verify</text><text x="296.0" y="75.0" class="m" text-anchor="middle">claim by claim</text>
<rect x="332" y="50" width="56" height="34" rx="5" class="bx"/><text x="360.0" y="65.0" class="g" text-anchor="middle" font-weight="600">Stream</text><text x="360.0" y="75.0" class="m" text-anchor="middle">SSE answer</text>
</g>
<path class="fl" d="M68 67h8"/><path class="fl" d="M132 67h8"/><path class="fl" d="M196 67h8"/><path class="fl" d="M260 67h8"/><path class="fl" d="M324 67h8"/>
<path class="fm" d="M296 84v22H104v-22"/>
<text x="200" y="118" class="w" font-size="6.5" text-anchor="middle">unsupported claim &#8594; re-query, then refuse</text>
<line x1="12" y1="134" x2="388" y2="134" stroke="var(--line)"/>
<text x="12" y="149" class="m" font-size="7.5">Plant documents in Swedish and English, answered with the revision they came from &#8212;</text>
<text x="12" y="161" class="m" font-size="7.5">or an honest &#8220;the documents do not say&#8221;.</text>
<text x="12" y="175" class="a" font-size="7.5" font-weight="600">Qdrant &#183; LangGraph &#183; Azure OpenAI &#183; FastAPI &#183; RAG-triad release gates</text>
</svg>
