<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" role="img" aria-label="10 MW photovoltaic plant, Nir, Yazd">
<style>
:root{--line:#30363d;--ink:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--grn:#3fb950;--amb:#d29922;--red:#f85149;--pnl:#161b22;--bg:#0d1117}
@media (prefers-color-scheme:light){:root{--line:#d0d7de;--ink:#24292f;--mut:#57606a;--acc:#0969da;--grn:#1a7f37;--amb:#9a6700;--red:#cf222e;--pnl:#f6f8fa;--bg:#ffffff}}
text{font-family:Inter,system-ui,-apple-system,sans-serif}
.t{fill:var(--ink)}.m{fill:var(--mut)}.a{fill:var(--acc)}.g{fill:var(--grn)}.w{fill:var(--amb)}
.bx{fill:var(--pnl);stroke:var(--line);stroke-width:1}
.bxa{fill:var(--pnl);stroke:var(--acc);stroke-width:1.4}
.fl{stroke:var(--acc);fill:none;stroke-width:1.4}
.fm{stroke:var(--mut);fill:none;stroke-width:1;stroke-dasharray:3 3}
</style>
<text x="12" y="20" class="t" font-size="11" font-weight="600">Nir PV Plant &#8212; 10 MW on-grid, Yazd, Iran</text>
<path d="M14 60 L54 60 L46 88 L6 88 Z" fill="var(--pnl)" stroke="var(--acc)" stroke-width="1.2"/>
<path d="M62 60 L102 60 L94 88 L54 88 Z" fill="var(--pnl)" stroke="var(--acc)" stroke-width="1.2"/>
<path d="M110 60 L150 60 L142 88 L102 88 Z" fill="var(--pnl)" stroke="var(--acc)" stroke-width="1.2"/>
<path class="fm" d="M20 67h30M16 74h30M12 81h30M68 67h30M64 74h30M60 81h30M116 67h30M112 74h30M108 81h30"/>
<text x="12" y="104" class="m" font-size="7.5">36,432 modules &#183; 1,584 strings</text>
<g font-size="7.5">
<rect class="bx" x="176" y="58" width="56" height="30" rx="4"/><text x="204" y="70" class="m" text-anchor="middle">9 &#215; inverter</text><text x="204" y="81" class="m" text-anchor="middle">SMA 1000CP</text>
<rect class="bx" x="252" y="58" width="52" height="30" rx="4"/><text x="278" y="70" class="m" text-anchor="middle">Substation</text><text x="278" y="81" class="m" text-anchor="middle">950 m away</text>
<rect class="bxa" x="324" y="58" width="60" height="30" rx="4"/><text x="354" y="70" class="a" text-anchor="middle" font-weight="600">GRID</text><text x="354" y="81" class="m" text-anchor="middle">10 MV free</text>
</g>
<path class="fl" d="M152 73h24M232 73h20M304 73h20"/>
<line x1="12" y1="118" x2="388" y2="118" stroke="var(--line)"/>
<g font-size="7.5">
<text x="12" y="134" class="m">Irradiation</text><text x="12" y="146" class="t" font-size="9.5" font-weight="600">~2000 kWh/m&#178;</text>
<text x="104" y="134" class="m">Yield yr 1</text><text x="104" y="146" class="t" font-size="9.5" font-weight="600">20,465 MWh</text>
<text x="200" y="134" class="m">Perf. ratio</text><text x="200" y="146" class="g" font-size="9.5" font-weight="600">87 %</text>
<text x="264" y="134" class="m">NPV</text><text x="264" y="146" class="g" font-size="9.5" font-weight="600">&#8364;25.8 M</text>
<text x="340" y="134" class="m">IRR</text><text x="340" y="146" class="g" font-size="9.5" font-weight="600">27 %</text>
</g>
<text x="12" y="170" class="m" font-size="7.5">&#8364;11.79 M investment &#183; 8-month build &#183; site at 2250 m, mean 13.2 &#176;C &#183; Kish Solar Trading Co.</text>
</svg>
