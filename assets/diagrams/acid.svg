<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" role="img" aria-label="Sulfuric acid plant maintenance strategy comparison">
<style>
:root{--line:#30363d;--ink:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--grn:#3fb950;--amb:#d29922;--red:#f85149;--pnl:#161b22;--bg:#0d1117}
@media (prefers-color-scheme:light){:root{--line:#d0d7de;--ink:#24292f;--mut:#57606a;--acc:#0969da;--grn:#1a7f37;--amb:#9a6700;--red:#cf222e;--pnl:#f6f8fa;--bg:#ffffff}}
text{font-family:Inter,system-ui,-apple-system,sans-serif}
.t{fill:var(--ink)}.m{fill:var(--mut)}.a{fill:var(--acc)}.g{fill:var(--grn)}.w{fill:var(--amb)}
.bx{fill:var(--pnl);stroke:var(--line);stroke-width:1}
.bxa{fill:var(--pnl);stroke:var(--acc);stroke-width:1.4}
.fl{stroke:var(--acc);fill:none;stroke-width:1.4}
.fm{stroke:var(--mut);fill:none;stroke-width:1;stroke-dasharray:3 3}
</style>
<text x="12" y="20" class="t" font-size="11" font-weight="600">Zinc Plating Plant &#8212; maintenance strategy comparison, 24/7</text>
<g font-size="7">
<rect class="bx" x="12" y="36" width="118" height="46" rx="4"/>
<text x="71" y="50" class="m" text-anchor="middle" font-weight="600">Breakdown</text>
<text x="71" y="62" class="m" text-anchor="middle">run to failure</text>
<rect class="bx" x="142" y="36" width="118" height="46" rx="4"/>
<text x="201" y="50" class="m" text-anchor="middle" font-weight="600">Preventive</text>
<text x="201" y="62" class="m" text-anchor="middle">fixed interval</text>
<rect class="bxa" x="272" y="36" width="116" height="46" rx="4"/>
<text x="330" y="50" class="a" text-anchor="middle" font-weight="600">Predictive</text>
<text x="330" y="62" class="m" text-anchor="middle">condition-based</text>
</g>
<rect x="24" y="68" width="94" height="8" fill="var(--red)" opacity="0.75"/>
<rect x="154" y="68" width="52" height="8" fill="var(--amb)" opacity="0.8"/>
<rect x="284" y="68" width="10" height="8" fill="var(--grn)" opacity="0.9"/>
<text x="12" y="98" class="m" font-size="6.5">bar length = annual downtime</text>
<line x1="12" y1="108" x2="388" y2="108" stroke="var(--line)"/>
<g font-size="7.5">
<text x="12" y="124" class="m">Scenarios</text><text x="12" y="137" class="t" font-size="10" font-weight="600">18</text>
<text x="96" y="124" class="m">Downtime cut</text><text x="96" y="137" class="g" font-size="10" font-weight="600">96.6 %</text>
<text x="212" y="124" class="m">Monthly cost cut</text><text x="212" y="137" class="g" font-size="10" font-weight="600">91.5 %</text>
<text x="330" y="124" class="m">Ranking</text><text x="330" y="137" class="a" font-size="10" font-weight="600">TOPSIS</text>
</g>
<text x="12" y="158" class="m" font-size="7.5">Rockwell Arena + OptQuest &#183; strategies scored on downtime, cost, crew utilisation and spares.</text>
<text x="12" y="172" class="m" font-size="7.5">Zinc plating plant at Bafgh &#183; the sulfuric acid unit is a side product &#183; MSc thesis</text>
</svg>
