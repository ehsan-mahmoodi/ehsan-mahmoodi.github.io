<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" role="img" aria-label="Energy-aware batch scheduling under spot pricing">
<style>
:root{--line:#30363d;--ink:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--grn:#3fb950;--amb:#d29922;--red:#f85149;--pnl:#161b22;--bg:#0d1117}
text{font-family:Inter,system-ui,-apple-system,sans-serif}
.t{fill:var(--ink)}.m{fill:var(--mut)}.a{fill:var(--acc)}.g{fill:var(--grn)}.w{fill:var(--amb)}
.bx{fill:var(--pnl);stroke:var(--line);stroke-width:1}
.bxa{fill:var(--pnl);stroke:var(--acc);stroke-width:1.4}
.fl{stroke:var(--acc);fill:none;stroke-width:1.4}
.fm{stroke:var(--mut);fill:none;stroke-width:1;stroke-dasharray:3 3}
</style>
<text x="12" y="20" class="t" font-size="11" font-weight="600">Energy-Aware Batch Scheduling &#8212; spot price and on-site solar</text>
<path class="fm" d="M12 84 L46 78 L80 62 L114 44 L148 40 L182 50 L216 66 L250 58 L284 44 L318 56 L352 72 L386 80"/>
<text x="12" y="34" class="w" font-size="6.5">spot price</text>
<path d="M12 96 L46 94 L80 88 L114 76 L148 66 L182 62 L216 66 L250 74 L284 84 L318 92 L352 96 L386 98" fill="none" stroke="var(--grn)" stroke-width="1.4"/>
<text x="150" y="110" class="g" font-size="6.5">on-site PV output</text>
<g font-size="6">
<rect x="96" y="118" width="34" height="12" fill="var(--acc)" opacity="0.6" rx="2"/><text x="113" y="127" class="t" text-anchor="middle">J1</text>
<rect x="136" y="118" width="26" height="12" fill="var(--acc)" opacity="0.6" rx="2"/><text x="149" y="127" class="t" text-anchor="middle">J2</text>
<rect x="168" y="118" width="40" height="12" fill="var(--acc)" opacity="0.6" rx="2"/><text x="188" y="127" class="t" text-anchor="middle">J3</text>
<rect x="266" y="118" width="32" height="12" fill="var(--acc)" opacity="0.6" rx="2"/><text x="282" y="127" class="t" text-anchor="middle">J4</text>
<rect x="228" y="118" width="30" height="12" fill="var(--amb)" opacity="0.5" rx="2" stroke="var(--amb)" stroke-dasharray="2 2"/><text x="243" y="127" class="w" text-anchor="middle">PM</text>
</g>
<text x="12" y="128" class="m" font-size="6.5">batches</text>
<line x1="12" y1="138" x2="388" y2="138" stroke="var(--line)"/>
<text x="12" y="152" class="m" font-size="7.5">Batches are pushed into cheap, solar-rich hours; flexible maintenance fills the expensive gap</text>
<text x="12" y="164" class="m" font-size="7.5">instead of blocking production. Multi-objective: makespan, energy cost, peak demand.</text>
<text x="12" y="176" class="a" font-size="7.5" font-weight="600">Applied Energy 2026 &#183; MOVNS and NSGA-II with CP bounds</text>
</svg>
