<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" role="img" aria-label="Agile manufacturing digital twin and AR">
<style>
:root{--line:#30363d;--ink:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--grn:#3fb950;--amb:#d29922;--red:#f85149;--pnl:#161b22;--bg:#0d1117}
text{font-family:Inter,system-ui,-apple-system,sans-serif}
.t{fill:var(--ink)}.m{fill:var(--mut)}.a{fill:var(--acc)}.g{fill:var(--grn)}.w{fill:var(--amb)}
.bx{fill:var(--pnl);stroke:var(--line);stroke-width:1}
.bxa{fill:var(--pnl);stroke:var(--acc);stroke-width:1.4}
.fl{stroke:var(--acc);fill:none;stroke-width:1.4}
.fm{stroke:var(--mut);fill:none;stroke-width:1;stroke-dasharray:3 3}
</style>
<text x="12" y="20" class="t" font-size="11" font-weight="600">ACCURATE 4.0 &#8212; optimisation-enabled digital twin</text>
<g font-size="6.5">
<rect class="bx" x="14" y="40" width="104" height="34" rx="4"/>
<text x="66" y="54" class="m" text-anchor="middle" font-weight="600">Physical line</text>
<text x="66" y="65" class="m" text-anchor="middle">sensors &#183; AR headset</text>
<rect class="bxa" x="148" y="40" width="104" height="34" rx="4"/>
<text x="200" y="54" class="a" text-anchor="middle" font-weight="600">Digital twin</text>
<text x="200" y="65" class="m" text-anchor="middle">synchronised model</text>
<rect class="bx" x="282" y="40" width="104" height="34" rx="4"/>
<text x="334" y="54" class="m" text-anchor="middle" font-weight="600">Optimiser</text>
<text x="334" y="65" class="m" text-anchor="middle">balance &#183; bottleneck</text>
</g>
<path class="fl" d="M118 52h30"/>
<path class="fl" d="M252 52h30"/>
<path class="fm" d="M334 74v18H66V74"/>
<text x="200" y="104" class="m" font-size="6.5" text-anchor="middle">decisions pushed back to the floor</text>
<g font-size="6">
<rect class="bx" x="14" y="112" width="118" height="24" rx="3"/><text x="73" y="122" class="m" text-anchor="middle" font-weight="600">Line balancing</text><text x="73" y="131" class="m" text-anchor="middle">human-robot collaboration</text>
<rect class="bx" x="142" y="112" width="118" height="24" rx="3"/><text x="201" y="122" class="m" text-anchor="middle" font-weight="600">Bottleneck analysis</text><text x="201" y="131" class="m" text-anchor="middle">dynamic shop-floor flow</text>
<rect class="bx" x="270" y="112" width="116" height="24" rx="3"/><text x="328" y="122" class="m" text-anchor="middle" font-weight="600">AR assistance</text><text x="328" y="131" class="m" text-anchor="middle">collision avoidance</text>
</g>
<line x1="12" y1="148" x2="388" y2="148" stroke="var(--line)"/>
<text x="12" y="163" class="m" font-size="7.5">Four years of doctoral work sat inside this project &#183; KK-stiftelsen SEK 24 M &#183; 2021&#8211;2025</text>
<text x="12" y="175" class="m" font-size="7.5">University of Sk&#246;vde</text>
</svg>
