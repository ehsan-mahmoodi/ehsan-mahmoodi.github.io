<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" role="img" aria-label="Multi-tenant platform: browser and partner systems through an API gateway to an orchestrator and AI tools, with tenant-isolated PostgreSQL, Redis and a metering ledger">
<style>
:root{--line:#30363d;--ink:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--grn:#3fb950;--amb:#d29922;--red:#f85149;--pnl:#161b22;--bg:#0d1117}
text{font-family:Inter,system-ui,-apple-system,sans-serif}
.t{fill:var(--ink)}.m{fill:var(--mut)}.a{fill:var(--acc)}.g{fill:var(--grn)}.w{fill:var(--amb)}.r{fill:var(--red)}
.bx{fill:var(--pnl);stroke:var(--line);stroke-width:1}
.bxa{fill:var(--pnl);stroke:var(--acc);stroke-width:1.4}
.fl{stroke:var(--acc);fill:none;stroke-width:1.4}
.fm{stroke:var(--mut);fill:none;stroke-width:1;stroke-dasharray:3 3}
</style>
<text x="12" y="20" class="t" font-size="11" font-weight="600">Multi-tenant GenAI platform &#8212; one gateway, isolated tenants</text>
<g font-size="6.5">
<rect x="12" y="32" width="62" height="28" rx="5" class="bx"/><text x="43.0" y="44.0" class="t" text-anchor="middle" font-weight="600">Next.js</text><text x="43.0" y="54.0" class="m" text-anchor="middle">SSR + SSE</text>
<rect x="12" y="68" width="62" height="28" rx="5" class="bx"/><text x="43.0" y="80.0" class="t" text-anchor="middle" font-weight="600">Partner API</text><text x="43.0" y="90.0" class="m" text-anchor="middle">workspace keys</text>
<rect x="96" y="48" width="64" height="32" rx="5" class="bx"/><text x="128.0" y="62.0" class="r" text-anchor="middle" font-weight="600">Gateway</text><text x="128.0" y="72.0" class="m" text-anchor="middle">SSO, rate limits</text>
<rect x="182" y="48" width="64" height="32" rx="5" class="bxa"/><text x="214.0" y="62.0" class="a" text-anchor="middle" font-weight="600">Orchestrator</text><text x="214.0" y="72.0" class="m" text-anchor="middle">FastAPI</text>
<rect x="268" y="32" width="120" height="28" rx="5" class="bx"/><text x="328.0" y="44.0" class="t" text-anchor="middle" font-weight="600">AI tools</text><text x="328.0" y="54.0" class="m" text-anchor="middle">RAG, copilots, agents, fine-tune</text>
<rect x="268" y="68" width="120" height="28" rx="5" class="bx"/><text x="328.0" y="80.0" class="t" text-anchor="middle" font-weight="600">Model endpoints</text><text x="328.0" y="90.0" class="m" text-anchor="middle">Azure OpenAI, vLLM</text>
<rect x="96" y="104" width="92" height="22" rx="5" class="bx"/><text x="142.0" y="113.0" class="g" text-anchor="middle" font-weight="600">PostgreSQL + RLS</text><text x="142.0" y="123.0" class="m" text-anchor="middle">pgvector per tenant</text>
<rect x="196" y="104" width="64" height="22" rx="5" class="bx"/><text x="228.0" y="113.0" class="t" text-anchor="middle" font-weight="600">Redis</text><text x="228.0" y="123.0" class="m" text-anchor="middle">buckets</text>
<rect x="268" y="104" width="120" height="22" rx="5" class="bx"/><text x="328.0" y="113.0" class="w" text-anchor="middle" font-weight="600">Metering ledger</text><text x="328.0" y="123.0" class="m" text-anchor="middle">usage per workspace</text>
</g>
<path class="fl" d="M74 46l22 12M74 82l22-12M160 64h22M246 58l22-12M246 70l22 12"/>
<path class="fm" d="M214 80v18M142 98h186M142 98v6M228 98v6M328 98v6"/>
<line x1="12" y1="134" x2="388" y2="134" stroke="var(--line)"/>
<text x="12" y="149" class="m" font-size="7.5">The platform that hosts the other five tools. Partners include competitors, so tenant isolation</text>
<text x="12" y="161" class="m" font-size="7.5">is enforced in identity, application and database, and tested on every deploy.</text>
<text x="12" y="175" class="a" font-size="7.5" font-weight="600">Next.js &#183; TypeScript &#183; FastAPI &#183; PostgreSQL &#183; Redis &#183; Entra ID &#183; API Management</text>
</svg>
