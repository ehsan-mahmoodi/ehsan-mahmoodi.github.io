<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" role="img" aria-label="Alloy property forecasting and ensemble optimisation">
<style>
:root{--line:#30363d;--ink:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--grn:#3fb950;--amb:#d29922;--red:#f85149;--pnl:#161b22;--bg:#0d1117}
@media (prefers-color-scheme:light){:root{--line:#d0d7de;--ink:#24292f;--mut:#57606a;--acc:#0969da;--grn:#1a7f37;--amb:#9a6700;--red:#cf222e;--pnl:#f6f8fa;--bg:#ffffff}}
text{font-family:Inter,system-ui,-apple-system,sans-serif}
.t{fill:var(--ink)}.m{fill:var(--mut)}.a{fill:var(--acc)}.g{fill:var(--grn)}.w{fill:var(--amb)}
.bx{fill:var(--pnl);stroke:var(--line);stroke-width:1}
.bxa{fill:var(--pnl);stroke:var(--acc);stroke-width:1.4}
.fl{stroke:var(--acc);fill:none;stroke-width:1.4}
.fm{stroke:var(--mut);fill:none;stroke-width:1;stroke-dasharray:3 3}
</style>
<text x="12" y="20" class="t" font-size="11" font-weight="600">Alloy Property Forecast &#8212; ensemble models and optimisation</text>
<g font-size="6.5">
<rect class="bx" x="12" y="38" width="62" height="24" rx="4"/><text x="43" y="53" class="m" text-anchor="middle">Composition</text>
<rect class="bx" x="12" y="68" width="62" height="24" rx="4"/><text x="43" y="83" class="m" text-anchor="middle">Heat treat</text>
</g>
<g font-size="6.5">
<rect class="bx" x="106" y="30" width="56" height="20" rx="3"/><text x="134" y="43" class="m" text-anchor="middle">Neural net</text>
<rect class="bx" x="106" y="56" width="56" height="20" rx="3"/><text x="134" y="69" class="m" text-anchor="middle">Random forest</text>
<rect class="bx" x="106" y="82" width="56" height="20" rx="3"/><text x="134" y="95" class="m" text-anchor="middle">XGBoost</text>
</g>
<path class="fl" d="M74 50h32M74 62h32M74 80h26M74 86h26"/>
<g font-size="6.5">
<rect class="bxa" x="188" y="52" width="56" height="30" rx="4"/>
<text x="216" y="64" class="a" text-anchor="middle" font-weight="600">Ensemble</text>
<text x="216" y="75" class="m" text-anchor="middle">stacked</text>
</g>
<path class="fl" d="M162 40 Q178 50 188 60"/>
<path class="fl" d="M162 66h26"/>
<path class="fl" d="M162 92 Q178 84 188 76"/>
<g font-size="6.5">
<rect class="bx" x="272" y="30" width="54" height="20" rx="3"/><text x="299" y="43" class="m" text-anchor="middle">Hardness</text>
<rect class="bx" x="272" y="56" width="54" height="20" rx="3"/><text x="299" y="69" class="m" text-anchor="middle">UTS</text>
<rect class="bx" x="272" y="82" width="54" height="20" rx="3"/><text x="299" y="95" class="m" text-anchor="middle">Yield str.</text>
</g>
<path class="fl" d="M244 60 Q260 48 272 42M244 67h28M244 74 Q260 84 272 90"/>
<g font-size="6.5">
<rect class="bxa" x="344" y="52" width="44" height="30" rx="4"/>
<text x="366" y="64" class="a" text-anchor="middle" font-weight="600">NSGA-II</text>
<text x="366" y="75" class="m" text-anchor="middle">design</text>
</g>
<path class="fl" d="M326 67h18"/>
<line x1="12" y1="118" x2="388" y2="118" stroke="var(--line)"/>
<text x="12" y="133" class="m" font-size="7.5">Predict mechanical properties from composition and processing, then search the composition</text>
<text x="12" y="145" class="m" font-size="7.5">space for alloys that hit several property targets at once, with an overfitting index guarding</text>
<text x="12" y="157" class="m" font-size="7.5">the comparison between strategies.</text>
<text x="12" y="173" class="a" font-size="7.5" font-weight="600">Python &#183; scikit-learn &#183; XGBoost &#183; DEAP &#183; Streamlit front end</text>
</svg>
