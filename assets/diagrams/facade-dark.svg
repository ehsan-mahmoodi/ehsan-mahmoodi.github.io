<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" role="img" aria-label="Facade material selection across cost, carbon and constructability">
<style>
:root{--line:#30363d;--ink:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--grn:#3fb950;--amb:#d29922;--pnl:#161b22}
text{font-family:Inter,system-ui,-apple-system,sans-serif}
.t{fill:var(--ink)}.m{fill:var(--mut)}.a{fill:var(--acc)}.g{fill:var(--grn)}
.bx{fill:var(--pnl);stroke:var(--line);stroke-width:1}
.bxa{fill:var(--pnl);stroke:var(--acc);stroke-width:1.4}
.fl{stroke:var(--acc);fill:none;stroke-width:1.4}
</style>
<text x="12" y="18" class="t" font-size="11" font-weight="600">Fa&#231;ade Material Selection &#8212; three objectives that disagree</text>
<g font-size="6.5">
<rect class="bx" x="12" y="30" width="62" height="14" rx="3"/><text x="43" y="40" class="m" text-anchor="middle">cladding options</text>
<rect class="bx" x="12" y="48" width="62" height="14" rx="3"/><text x="43" y="58" class="m" text-anchor="middle">NZ climate zones</text>
<rect class="bx" x="12" y="66" width="62" height="14" rx="3"/><text x="43" y="76" class="m" text-anchor="middle">build method</text>
</g>
<path class="fl" d="M74 37 Q90 44 100 52M74 55h26M74 73 Q90 66 100 58"/>
<rect class="bxa" x="100" y="42" width="52" height="26" rx="4"/>
<text x="126" y="53" class="a" font-size="7" text-anchor="middle" font-weight="600">Assessment</text>
<text x="126" y="63" class="m" font-size="6.5" text-anchor="middle">model</text>
<g font-size="6.5">
<rect class="bx" x="176" y="26" width="76" height="20" rx="3"/><text x="214" y="39" class="m" text-anchor="middle">Cost / m&#178;</text>
<rect class="bx" x="176" y="52" width="76" height="20" rx="3"/><text x="214" y="65" class="g" text-anchor="middle">Embodied carbon</text>
<rect class="bx" x="176" y="78" width="76" height="20" rx="3"/><text x="214" y="91" class="m" text-anchor="middle">Constructability</text>
</g>
<path class="fl" d="M152 50 Q166 42 176 37M152 58 Q166 60 176 62M152 64 Q166 78 176 87"/>
<g font-size="6.5">
<rect class="bxa" x="284" y="40" width="104" height="34" rx="4"/>
<text x="336" y="53" class="a" text-anchor="middle" font-weight="600">Ranked shortlist</text>
<text x="336" y="65" class="m" text-anchor="middle">trade-offs made explicit</text>
</g>
<path class="fl" d="M252 36 Q270 42 284 50M252 62h32M252 88 Q270 78 284 66"/>
<line x1="12" y1="110" x2="388" y2="110" stroke="var(--line)"/>
<text x="12" y="124" class="m" font-size="7">The cheapest cladding is rarely the lowest carbon, and the lowest carbon is often the</text>
<text x="12" y="135" class="m" font-size="7">hardest to build. Picking one objective hides the other two, so all three are scored and</text>
<text x="12" y="146" class="m" font-size="7">the trade-off is handed to the specifier rather than buried in a single number.</text>
<text x="12" y="166" class="a" font-size="7.5" font-weight="600">Web application &#183; University of Auckland</text>
</svg>
