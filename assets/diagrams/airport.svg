<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" role="img" aria-label="Airport 3D simulation model and dashboard">
<style>
:root{--line:#30363d;--ink:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--grn:#3fb950;--amb:#d29922;--red:#f85149;--pnl:#161b22;--bg:#0d1117}
@media (prefers-color-scheme:light){:root{--line:#d0d7de;--ink:#24292f;--mut:#57606a;--acc:#0969da;--grn:#1a7f37;--amb:#9a6700;--red:#cf222e;--pnl:#f6f8fa;--bg:#ffffff}}
text{font-family:Inter,system-ui,-apple-system,sans-serif}
.t{fill:var(--ink)}.m{fill:var(--mut)}.a{fill:var(--acc)}.g{fill:var(--grn)}.w{fill:var(--amb)}
.bx{fill:var(--pnl);stroke:var(--line);stroke-width:1}
.bxa{fill:var(--pnl);stroke:var(--acc);stroke-width:1.4}
.fl{stroke:var(--acc);fill:none;stroke-width:1.4}
.fm{stroke:var(--mut);fill:none;stroke-width:1;stroke-dasharray:3 3}
</style>
<text x="12" y="20" class="t" font-size="11" font-weight="600">Airport Terminal &#8212; 3D passenger flow model</text>
<g font-size="7">
<rect class="bx" x="12" y="40" width="56" height="28" rx="4"/><text x="40" y="57" class="m" text-anchor="middle">Curbside</text>
<rect class="bx" x="82" y="40" width="56" height="28" rx="4"/><text x="110" y="57" class="m" text-anchor="middle">Check-in</text>
<rect class="bxa" x="152" y="40" width="56" height="28" rx="4"/><text x="180" y="52" class="a" text-anchor="middle" font-weight="600">Security</text><text x="180" y="63" class="m" text-anchor="middle">bottleneck</text>
<rect class="bx" x="222" y="40" width="56" height="28" rx="4"/><text x="250" y="57" class="m" text-anchor="middle">Passport</text>
<rect class="bx" x="292" y="40" width="56" height="28" rx="4"/><text x="320" y="57" class="m" text-anchor="middle">Gate</text>
</g>
<path class="fl" d="M68 54h14M138 54h14M208 54h14M278 54h14"/>
<g font-size="6.5">
<rect class="bx" x="12" y="88" width="108" height="50" rx="4"/>
<text x="66" y="102" class="m" text-anchor="middle" font-weight="600">Queue length</text>
<rect x="22" y="112" width="12" height="18" fill="var(--acc)" opacity="0.4"/>
<rect x="40" y="106" width="12" height="24" fill="var(--acc)" opacity="0.5"/>
<rect x="58" y="96" width="12" height="34" fill="var(--amb)" opacity="0.85"/>
<rect x="76" y="110" width="12" height="20" fill="var(--acc)" opacity="0.45"/>
<rect x="94" y="118" width="12" height="12" fill="var(--acc)" opacity="0.3"/>
</g>
<g font-size="6.5">
<rect class="bx" x="132" y="88" width="108" height="50" rx="4"/>
<text x="186" y="102" class="m" text-anchor="middle" font-weight="600">Utilisation</text>
<path class="fl" d="M142 128 L160 120 L178 108 L196 112 L214 100 L230 104"/>
</g>
<g font-size="6.5">
<rect class="bx" x="252" y="88" width="96" height="50" rx="4"/>
<text x="300" y="102" class="m" text-anchor="middle" font-weight="600">3D walkthrough</text>
<path class="fm" d="M266 112 L300 106 L334 112 L334 128 L300 134 L266 128 Z"/>
</g>
<line x1="12" y1="150" x2="388" y2="150" stroke="var(--line)"/>
<text x="12" y="165" class="m" font-size="7.5">Arena 3D model with live dashboard &#8212; terminal layout and staffing tested before any build.</text>
<text x="12" y="176" class="m" font-size="7.5">2015</text>
</svg>
