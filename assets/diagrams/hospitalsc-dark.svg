<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180" role="img" aria-label="Emergency department patient flow with an imaging bottleneck, scored by cost and outcome together">
<style>
:root{--line:#30363d;--ink:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--grn:#3fb950;--amb:#d29922;--red:#f85149;--pnl:#161b22;--bg:#0d1117}
text{font-family:Inter,system-ui,-apple-system,sans-serif}
.t{fill:var(--ink)}.m{fill:var(--mut)}.a{fill:var(--acc)}.g{fill:var(--grn)}.w{fill:var(--amb)}
.bx{fill:var(--pnl);stroke:var(--line);stroke-width:1}
.bxa{fill:var(--pnl);stroke:var(--amb);stroke-width:1.4}
.fl{stroke:var(--acc);fill:none;stroke-width:1.4}
.fm{stroke:var(--mut);fill:none;stroke-width:1;stroke-dasharray:3 3}
</style>
<text x="12" y="20" class="t" font-size="11" font-weight="600">Emergency Department &#8212; simulated patient flow and imaging bottleneck</text>
<g font-size="6.5">
<rect class="bx" x="12" y="40" width="52" height="26" rx="4"/><text x="38" y="56" class="m" text-anchor="middle">Triage</text>
<rect class="bx" x="78" y="40" width="60" height="26" rx="4"/><text x="108" y="52" class="m" text-anchor="middle">Emergency</text><text x="108" y="62" class="m" text-anchor="middle">1 &amp; 2</text>
<rect class="bxa" x="152" y="40" width="60" height="26" rx="4"/><text x="182" y="52" class="w" text-anchor="middle">CT / MRI</text><text x="182" y="62" class="w" text-anchor="middle">queue</text>
<rect class="bx" x="226" y="40" width="60" height="26" rx="4"/><text x="256" y="56" class="m" text-anchor="middle">Discharge</text>
<rect class="bx" x="300" y="40" width="52" height="26" rx="4"/><text x="326" y="56" class="m" text-anchor="middle">Admit</text>
</g>
<path class="fl" d="M64 53h14M138 53h14M212 53h14"/>
<path class="fm" d="M286 53h14"/>
<g font-size="6.5">
<rect class="bx" x="40" y="86" width="150" height="40" rx="4"/>
<text x="115" y="99" class="m" text-anchor="middle" font-weight="600">Efficiency score by scenario</text>
<circle cx="66" cy="118" r="2.5" fill="var(--red)"/><circle cx="90" cy="110" r="2.5" fill="var(--amb)"/>
<circle cx="120" cy="106" r="2.5" fill="var(--acc)"/><circle cx="150" cy="102" r="2.5" fill="var(--grn)"/>
<path d="M62 120 Q100 108 154 102" fill="none" stroke="var(--mut)" stroke-width="1" stroke-dasharray="2 2"/>
</g>
<g font-size="6.5">
<rect class="bx" x="212" y="86" width="150" height="40" rx="4"/>
<text x="287" y="99" class="m" text-anchor="middle" font-weight="600">The finding</text>
<text x="287" y="112" class="w" text-anchor="middle">85% of patients need CT/MRI &mdash;</text>
<text x="287" y="121" class="w" text-anchor="middle">that queue, not staff, sets length of stay</text>
</g>
<line x1="12" y1="140" x2="388" y2="140" stroke="var(--line)"/>
<text x="12" y="155" class="m" font-size="7.5">Ten capacity and priority scenarios, simulated and scored on cost and patient outcomes together.</text>
<text x="12" y="169" class="m" font-size="7.5">Imam Khomeini Hospital, Tehran</text>
</svg>
